<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英打遊戲版本三 - ASDF 練習</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f8f9fa; color: #2d3748; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; max-width: 500px; width: 100%; }
        h1 { margin-top: 0; color: #2b6cb0; }
        .target-box { font-size: 5rem; font-weight: bold; color: #dd6b20; height: 120px; display: flex; align-items: center; justify-content: center; background: #fffaf0; border: 3px dashed #fbd38d; border-radius: 12px; margin: 20px 0; }
        .score-board { font-size: 1.2rem; margin-bottom: 20px; font-weight: bold; color: #4a5568; }
        .keyboard { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; }
        .key { width: 60px; height: 60px; border: 2px solid #cbd5e0; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; background: #edf2f7; color: #4a5568; transition: all 0.1s; }
        .key.active { background: #e53e3e; color: white; border-color: #c53030; box-shadow: 0 0 12px rgba(229,62,62,0.5); transform: scale(1.08); }
        .btn-group { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        button { padding: 10px 20px; font-size: 1rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; background: #319795; color: white; }
        button:hover { background: #2c7a7b; }
        button.stop { background: #e53e3e; }
        button.stop:hover { background: #c53030; }
        a.back { display: inline-block; color: #2b6cb0; text-decoration: none; font-weight: bold; }
        a.back:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="card">
        <h1>英打遊戲 v3：ASDF 練習</h1>
        <div class="score-board">得分：<span id="score">0</span> 分</div>
        <div class="target-box" id="target">-</div>

        <div class="keyboard">
            <div class="key" id="key-A">A</div>
            <div class="key" id="key-S">S</div>
            <div class="key" id="key-D">D</div>
            <div class="key" id="key-F">F</div>
        </div>

        <div class="btn-group">
            <button id="start-btn" onclick="startGame()">開始練習</button>
            <button id="stop-btn" class="stop" onclick="stopGame()" style="display:none;">停止練習</button>
        </div>

        <a href="../index.html" class="back">← 回到開發歷程首頁</a>
    </div>

    <script>
        const keys = ['A', 'S', 'D', 'F'];
        let currentTarget = '';
        let score = 0;
        let isPlaying = false;
        let isKeyDown = false;

        function startGame() {
            score = 0;
            isPlaying = true;
            document.getElementById('score').textContent = score;
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('stop-btn').style.display = 'inline-block';
            nextQuestion();
        }

        function stopGame() {
            isPlaying = false;
            currentTarget = '';
            document.getElementById('target').textContent = '-';
            clearHighlights();
            document.getElementById('start-btn').style.display = 'inline-block';
            document.getElementById('stop-btn').style.display = 'none';
        }

        function nextQuestion() {
            clearHighlights();
            const randomIndex = Math.floor(Math.random() * keys.length);
            currentTarget = keys[randomIndex];
            document.getElementById('target').textContent = currentTarget;
            document.getElementById(`key-${currentTarget}`).classList.add('active');
        }

        function clearHighlights() {
            keys.forEach(k => document.getElementById(`key-${k}`).classList.remove('active'));
        }

        window.addEventListener('keydown', (e) => {
            if (!isPlaying || isKeyDown) return;
            isKeyDown = true;

            const pressed = e.key.toUpperCase();
            if (pressed === currentTarget) {
                score++;
                document.getElementById('score').textContent = score;
                nextQuestion();
            }
        });

        window.addEventListener('keyup', () => { isKeyDown = false; });
    </script>
</body>
</html>
