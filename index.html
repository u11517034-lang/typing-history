<!DOCTYPE html>

    <style>
        body {

        .card:hover {
            transform: translateY(-4px);

        }
        .card h2 { color: #2b6cb0; margin-top: 0; font-size: 1.3rem; }
        .card p { color: #718096; font-size: 0.95rem; }
        .tag {
            display: inline-block;
            background: #edf2f7;
            color: #2b6cb0;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
